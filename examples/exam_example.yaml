# Exam definition. Keys and ids are English; the exam content is in Spanish,
# the language the students write in.
id: bio-101-midterm-1
title: Biología 101 — Parcial 1
course: BIO-101
rubric_version: 1
questions:
  - id: q1
    number: "1"
    type: short_answer
    prompt: Explica la diferencia entre mitosis y meiosis.
    reference_answer: >
      La mitosis produce dos células hijas diploides genéticamente idénticas
      (crecimiento y reparación). La meiosis produce cuatro células haploides
      genéticamente distintas (gametos), con recombinación en la profase I.
    criteria:
      - id: products
        description: Indica el número y la ploidía de las células resultantes de cada proceso
        max_points: 2
        levels:
          "2": Ambos procesos correctos (número y ploidía)
          "1": Solo uno correcto, o falta la ploidía
          "0": Incorrecto o ausente
      - id: purpose
        description: Explica la función biológica de cada proceso
        max_points: 2
        levels:
          "2": Función de ambos procesos explicada correctamente
          "1": Solo una función, o explicación vaga
          "0": Ausente
      - id: variation
        description: Menciona la variabilidad genética (recombinación / segregación independiente)
        max_points: 1
        levels:
          "1": Menciona la variabilidad y su origen
          "0": No la menciona

  - id: q2
    number: "2"
    type: essay
    prompt: >
      Describe la fotosíntesis: dónde ocurre, cuáles son sus reactivos y
      productos, y por qué es importante para los seres vivos.
    reference_answer: >
      Ocurre en los cloroplastos. A partir de dióxido de carbono y agua, usando
      la energía de la luz, se producen glucosa y oxígeno. Es la base de las
      cadenas tróficas y la fuente del oxígeno atmosférico.
    criteria:
      - id: reactants_products
        description: Indica el lugar (cloroplasto), los reactivos y los productos
        max_points: 2
        levels:
          "2": Lugar, reactivos y productos correctos
          "1": Respuesta incompleta o con un error
          "0": Incorrecto o ausente
      - id: importance
        description: Explica la importancia de la fotosíntesis para los seres vivos
        max_points: 1
        levels:
          "1": Relaciona la fotosíntesis con el oxígeno o con las cadenas tróficas
          "0": No explica su importancia
